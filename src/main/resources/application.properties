spring.application.name=mutual-fund-evaluation
server.port=8088


spring.mvc.servlet.path=/mf/v1
server.servlet.context-path=/

logging.level.org.springframework.security=DEBUG


logging.level.root=INFO
loggin.level.org.springframework.web: INFO
logging.level.org.springframework.boot.autoconfigure.web: DEBUG


# H2 Database
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:mfdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.h2.console.path=/h2-console

jwt.secret=
jwt.expiration-ms=3600000